media:
  input: public/media
  output: /media

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Full name
        type: string
      - name: shortName
        label: Short name (used in headlines)
        type: string
      - name: role
        label: Role
        type: string
      - name: description
        label: SEO / meta description
        type: text
      - name: email
        label: Email
        type: string
      - name: bio
        label: About bio (one or two paragraphs)
        type: text
      - name: polaroids
        label: About polaroid strip
        type: object
        list:
          min: 0
          max: 4
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
          - name: caption
            label: Caption
            type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Platform
            type: select
            options:
              values: ["Linkedin", "Twitter", "Instagram", "Substack", "YouTube"]
          - name: href
            label: Profile URL
            type: string

  - name: experiences
    label: Experiences
    type: collection
    path: content/experiences
    filename: "{fields.slug}.md"
    view:
      fields: [order, title, company, dateStart, dateEnd]
    fields:
      - name: title
        label: Title
        type: string
      - name: slug
        label: Slug
        type: string
      - name: order
        label: Display order
        type: number
      - name: company
        label: Company / Organization
        type: string
      - name: role
        label: Role
        type: string
      - name: location
        label: Location
        type: string
      - name: dateStart
        label: Start date
        type: date
      - name: dateEnd
        label: End date (leave blank for present)
        type: date
      - name: summary
        label: Summary
        type: text
      - name: href
        label: External URL
        type: string
      - name: visitLabel
        label: Visit button label
        type: string
      - name: logo
        label: Logo
        type: image
      - name: media
        label: Media embeds
        type: object
        list: true
        fields:
          - name: type
            label: Media type
            type: select
            options:
              values: ["youtube", "vimeo", "iframe", "image", "link"]
          - name: url
            label: URL
            type: string
          - name: title
            label: Title
            type: string
          - name: thumbnail
            label: Thumbnail
            type: image
      - name: body
        label: Body
        type: rich-text

  - name: projects
    label: Projects / initiatives
    type: collection
    path: content/projects
    filename: "{fields.slug}.md"
    view:
      fields: [order, title, type, status, href]
    fields:
      - name: slug
        label: Slug
        type: string
      - name: title
        label: Title
        type: string
      - name: order
        label: Display order
        type: number
      - name: type
        label: Project type
        type: select
        options:
          values: ["Writing", "Video", "Tools", "Profiles"]
      - name: status
        label: Status
        type: select
        options:
          values: ["Active", "Archive", "Profile"]
      - name: dateStart
        label: Start date
        type: date
      - name: dateEnd
        label: End date (leave blank for present)
        type: date
      - name: image
        label: Cover image
        type: image
      - name: summary
        label: Summary
        type: text
      - name: href
        label: External URL
        type: string
      - name: relatedExperience
        label: Related experience slug
        type: string
      - name: platforms
        label: Platforms
        type: select
        list: true
        options:
          values: ["Linkedin", "Twitter", "Instagram", "Substack", "YouTube"]
      - name: featured
        label: Featured project
        type: boolean
      - name: body
        label: Body
        type: rich-text

  - name: archives_substack
    label: Archives / Substack
    type: collection
    path: content/archives/substack
    filename: "{fields.slug}.md"
    view: &archive_view
      fields: [title, project, entryType, platform, date]
    fields: &archive_fields
      - name: slug
        label: Slug
        type: string
      - name: platform
        label: Platform
        type: select
        options:
          values: ["Linkedin", "Twitter", "Instagram", "Substack", "YouTube"]
      - name: projectType
        label: Project type (auto from project if blank)
        type: select
        options:
          values: ["Writing", "Video", "Tools", "Profiles"]
      - name: project
        label: Linked project / initiative slug
        type: string
      - name: entryType
        label: Entry type
        type: select
        options:
          values: ["Article", "Video", "Post", "Profile", "Tool", "Prototype", "Project"]
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
      - name: href
        label: External URL
        type: string
      - name: date
        label: Date
        type: date
      - name: summary
        label: Summary
        type: text
      - name: featured
        label: Featured entry
        type: boolean

  - name: archives_youtube
    label: Archives / YouTube
    type: collection
    path: content/archives/youtube
    filename: "{fields.slug}.md"
    view: *archive_view
    fields: *archive_fields

  - name: archives_twitter
    label: Archives / Twitter
    type: collection
    path: content/archives/twitter
    filename: "{fields.slug}.md"
    view: *archive_view
    fields: *archive_fields

  - name: archives_linkedin
    label: Archives / LinkedIn
    type: collection
    path: content/archives/linkedin
    filename: "{fields.slug}.md"
    view: *archive_view
    fields: *archive_fields

  - name: archives_instagram
    label: Archives / Instagram
    type: collection
    path: content/archives/instagram
    filename: "{fields.slug}.md"
    view: *archive_view
    fields: *archive_fields

settings:
  hide: false
  content:
    merge: true
