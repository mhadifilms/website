media:
  input: public/media
  output: /media

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    fields:
      - name: name
        label: Full name
        type: string
      - name: shortName
        label: Short name (used in headlines)
        type: string
      - name: role
        label: Role
        type: string
      - name: description
        label: SEO / meta description
        type: text
      - name: email
        label: Email
        type: string
      - name: bio
        label: About bio (one or two paragraphs)
        type: text
      - name: polaroids
        label: About polaroid strip
        type: object
        list:
          min: 0
          max: 4
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt text
            type: string
          - name: caption
            label: Caption
            type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Platform
            type: select
            options:
              values: ["Linkedin", "Twitter", "Instagram", "Substack", "YouTube"]
          - name: href
            label: Profile URL
            type: string

  - name: experiences
    label: Experiences
    type: collection
    path: content/experiences
    filename: "{fields.slug}.md"
    view:
      fields: [title, company, dateStart, dateEnd]
    fields:
      - name: title
        label: Title
        type: string
      - name: slug
        label: Slug
        type: string
      - name: company
        label: Company / Organization
        type: string
      - name: role
        label: Role
        type: string
      - name: location
        label: Location
        type: string
      - name: dateStart
        label: Start date
        type: date
      - name: dateEnd
        label: End date (leave blank for present)
        type: date
      - name: summary
        label: Summary
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: href
        label: External URL
        type: string
      - name: logo
        label: Logo
        type: image
      - name: body
        label: Body
        type: rich-text

  - name: archives
    label: Archives
    type: collection
    path: content/archives
    filename: "{fields.slug}.md"
    view:
      fields: [title, platform, date]
    fields:
      - name: slug
        label: Slug
        type: string
      - name: platform
        label: Platform
        type: select
        options:
          values: ["Linkedin", "Twitter", "Instagram", "Substack", "YouTube"]
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
      - name: href
        label: External URL
        type: string
      - name: date
        label: Date
        type: date
      - name: summary
        label: Summary
        type: text

settings:
  hide: false
  content:
    merge: true
